[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-reachy-mini"
version = "0.1.0"
description = "Aplicación educativa del Sistema Solar para Reachy Mini"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "reachy-mini>=1.8,<2",
    "opencv-python-headless>=4.8,<5",
    "SpeechRecognition>=3.10,<4",
]

[project.optional-dependencies]
cards = ["qrcode[pil]>=8,<9"]
keywords = ["reachy-mini-app", "educacion", "sistema-solar"]

[project.entry-points."reachy_mini_apps"]
astro-reachy = "reachy_sistema_solar.main:ReachySistemaSolar"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
